[project]
name = "mental-health-viz"
version = "1.0.0"
description = "Global mental health analytics and storytelling dashboards using WHO (2021) and IHME GBD (2023) data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nawfal Razouk", email = "nawfalrazouk@icloud.com" }]
keywords = ["data-science", "public-health", "streamlit", "machine-learning", "visualization", "WHO", "IHME", "GBD"]

# Core dependencies needed to run v0/v1 dashboards and pipelines.
dependencies = [
    "pandas>=2.0",
    "numpy<2",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "streamlit>=1.30",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pycountry>=22.3",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Advanced analytics used by v2/v3 (clustering, forecasting, graphs, rules).
advanced = [
    "tslearn>=0.6",
    "torch>=2.0",
    "networkx>=3.0",
    "mlxtend==0.23.1",
    "streamlit-plotly-events>=0.0.6",
    "great_expectations>=0.18",
]
# Developer tooling (lint, tests).
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/NawfalRAZOUK7/Mental-Health"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["v0", "v1", "v2", "v3", "data_raw", "report_latex", ".venv"]

[tool.ruff.lint]
# Sensible default rule set; keep signal high without being noisy.
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

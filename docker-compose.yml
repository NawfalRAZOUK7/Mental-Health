# One command to run the whole project locally:  docker compose up --build
# Dashboard -> http://localhost:8501    Prediction API -> http://localhost:8000/docs
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: mental-health-viz-dashboard
    ports:
      - "8501:8501"
    environment:
      - MHP_VERSION=v1
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mental-health-viz-api
    ports:
      - "8000:8000"
    environment:
      - MHP_VERSION=v1
    restart: unless-stopped
